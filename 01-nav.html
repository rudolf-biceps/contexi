<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigace – Contexi components</title>
  <style>
    @font-face { font-family: 'ContexiTest1'; src: url('fonts/ContexiTest1-10Hairline.otf') format('opentype'); font-weight: 100; font-style: normal; font-display: swap; }
    @font-face { font-family: 'ContexiTest1'; src: url('fonts/ContexiTest1-20Thin.otf')      format('opentype'); font-weight: 200; font-style: normal; font-display: swap; }
    @font-face { font-family: 'ContexiTest1'; src: url('fonts/ContexiTest1-30Extralight.otf') format('opentype'); font-weight: 300; font-style: normal; font-display: swap; }
    @font-face { font-family: 'ContexiTest1'; src: url('fonts/ContexiTest1-40Light.otf')     format('opentype'); font-weight: 350; font-style: normal; font-display: swap; }
    @font-face { font-family: 'ContexiTest1'; src: url('fonts/ContexiTest1-50Regular.otf')   format('opentype'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'ContexiTest1'; src: url('fonts/ContexiTest1-60Medium.otf')    format('opentype'); font-weight: 500; font-style: normal; font-display: swap; }
    @font-face { font-family: 'ContexiTest1'; src: url('fonts/ContexiTest1-70Semibold.otf')  format('opentype'); font-weight: 600; font-style: normal; font-display: swap; }
    @font-face { font-family: 'ContexiTest1'; src: url('fonts/ContexiTest1-80Bold.otf')      format('opentype'); font-weight: 700; font-style: normal; font-display: swap; }
    @font-face { font-family: 'ContexiTest1'; src: url('fonts/ContexiTest1-90Black.otf')     format('opentype'); font-weight: 900; font-style: normal; font-display: swap; }

    :root {
      --color-neutral-50:  #FAF8F5;
      --color-neutral-100: #F3EFE8;
      --color-neutral-200: #E8E2D8;
      --color-neutral-300: #D5CCBE;
      --color-neutral-400: #B5A99A;
      --color-neutral-600: #7A6E61;
      --color-neutral-800: #3D3530;
      --color-neutral-900: #1E1A16;
      --color-amber-400:   #D4952A;
      --color-lavender-300: #C5BAE8;
      --color-text-primary:   #1E1A16;
      --color-text-secondary: #7A6E61;
      --color-bg-page:        #F5F0EA;
      --color-bg-section:     #FFFFFF;
      --color-card-border:    #E8E2D8;
      --color-card-bg:        #FFFFFF;
      --color-card-hover-bg:  #FAF8F5;
      --font-family: 'ContexiTest1', -apple-system, BlinkMacSystemFont, sans-serif;
      --text-2xl: 42px;
      --text-xl:  32px;
      --text-lg:  24px;
      --text-md:  16px;
      --text-sm:  14px;
      --section-py: 96px;
      --container-max: 1170px;
      --card-radius: 12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-family);
      background: var(--color-bg-page);
      color: var(--color-text-primary);
      -webkit-font-smoothing: antialiased;
    }
    /* Back link */
    .back-bar {
      background: var(--color-neutral-900);
      padding: 12px 32px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,.6);
      text-decoration: none;
      transition: color .15s;
    }
    .back-link:hover { color: #fff; }
    .back-link svg { width: 16px; height: 16px; }

    .site-nav { background: #fff; border-bottom: 1px solid var(--color-card-border); }
    .site-nav__inner { max-width: 1440px; margin: 0 auto; padding: 0 32px; height: 82px; display: flex; align-items: center; }
    .site-nav__logo { font-size: 22px; font-weight: 700; color: var(--color-text-primary); text-decoration: none; letter-spacing: -0.5px; flex-shrink: 0; margin-right: auto; }
    .site-nav__links { display: flex; align-items: center; gap: 4px; list-style: none; }
    .site-nav__links a { display: block; padding: 8px 12px; font-size: 14px; color: var(--color-text-primary); text-decoration: none; border-radius: 8px; white-space: nowrap; transition: background .15s; }
    .site-nav__links a:hover { background: var(--color-neutral-100); }
    .site-nav__actions { display: flex; align-items: center; gap: 8px; margin-left: 16px; flex-shrink: 0; }
    .site-nav__icon-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: transparent; border: none; cursor: pointer; color: var(--color-text-secondary); transition: background .15s; }
    .site-nav__icon-btn:hover { background: var(--color-neutral-100); }
    .site-nav__icon-btn svg { width: 18px; height: 18px; }
    .site-nav__avatar { width: 36px; height: 36px; border-radius: 50%; background: #E8D5B0; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--color-neutral-800); border: none; }
    .site-nav__avatar svg { width: 18px; height: 18px; }
    .site-nav__cta { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: var(--color-lavender-300); color: var(--color-text-primary); font-size: 14px; font-weight: 500; text-decoration: none; white-space: nowrap; border: none; cursor: pointer; font-family: var(--font-family); }
    .site-nav__cta svg { width: 16px; height: 16px; flex-shrink: 0; }

  </style>
</head>
<body>
<div class="back-bar">
  <a href="index.html" class="back-link">
    <svg viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Zpět na přehled
  </a>
</div>
<header class="site-nav">
  <div class="site-nav__inner">
    <a href="#" class="site-nav__logo">Contexi</a>
    <nav><ul class="site-nav__links">
      <li><a href="#">Co se z&nbsp;DNA testu dozvíte</a></li>
      <li><a href="#">Pro lékaře</a></li>
      <li><a href="#">Bezpečnost a&nbsp;ochrana dat</a></li>
      <li><a href="#">Contexi Wiki</a></li>
      <li><a href="#">Blog</a></li>
      <li><a href="#">Kontakt</a></li>
    </ul></nav>
    <div class="site-nav__actions">
      <button class="site-nav__icon-btn"><svg viewBox="0 0 18 18" fill="none"><circle cx="8" cy="8" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M12 12l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      <button class="site-nav__avatar"><svg viewBox="0 0 18 18" fill="none"><circle cx="9" cy="6.5" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 15c0-3.038 2.462-5 5.5-5s5.5 1.962 5.5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      <a href="#" class="site-nav__cta">Přečíst svou DNA <svg viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    </div>
  </div>
</header>
</body>
</html>
